<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Tandem app icon: two chevrons moving forward together - "in tandem" -
       without the literal bicycle. On the app's own One UI accent (the same
       blue->teal of gui.py's .oneui-primary), so icon and interface are one. -->
  <defs>
    <linearGradient id="bt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#12b6c8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bt)"/>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 40 L66 64 L42 88"/>
    <path d="M68 40 L92 64 L68 88" stroke="#dbe8ff"/>
  </g>
</svg>
