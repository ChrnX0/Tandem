name: Um programa não funcionou
description: Clique duplo que não abriu, erro, ou programa que abre errado
title: "[não abriu] "
labels: ["não funcionou"]
body:
  - type: markdown
    attributes:
      value: |
        Não precisa saber nada de técnico. O Tandem monta o relatório para você:

        ```bash
        tandem socorro
        ```

        Ele gera um arquivo na sua pasta pessoal. **Dê uma olhada antes de
        anexar** — ele mostra caminhos de arquivos da sua máquina.
  - type: textarea
    id: oque
    attributes:
      label: O que você tentou fazer?
      placeholder: |
        Cliquei duas vezes no instalador do sistema da loja e não aconteceu nada.
    validations:
      required: true
  - type: textarea
    id: oque_apareceu
    attributes:
      label: O que apareceu na tela?
      description: Se apareceu uma janela, copie o texto dela ou anexe uma foto.
    validations:
      required: false
  - type: input
    id: programa
    attributes:
      label: Que programa é?
      description: Nome e versão, se você souber. Não precisa anexar o programa.
      placeholder: "Sistema de PDV XYZ 4.2, instalador de 32 bits"
    validations:
      required: false
  - type: textarea
    id: socorro
    attributes:
      label: Relatório do "tandem socorro"
      description: Cole o conteúdo, ou anexe o arquivo arrastando para cá.
      render: text
    validations:
      required: false
