name: Release

# The README pointed people at Releases to download the .deb, and for thirteen
# versions there was no release at all: the link led to an empty page. Pushing a
# tag now builds the package and attaches it, with the suite and lintian running
# first — a release nobody checked is worse than no release.
#
# Two ways in, and both end in the same place:
#
#   git tag v3.6 && git push origin v3.6      # from a terminal
#   Actions -> Release -> Run workflow        # from the browser
#
# The second one exists because pushing a tag needs a terminal with push rights,
# and the person who maintains this is not always at one. On that path the
# workflow CREATES the tag itself, at the commit it ran from, so the release and
# the tag can never disagree.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 3.5). Empty = the one in debian/control."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck desktop-file-utils lintian winetricks

      - name: The version has to agree with debian/control
        run: |
          control="$(grep '^Version:' debian/control | cut -d' ' -f2)"
          asked="${{ inputs.version }}"
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
              tag="${GITHUB_REF_NAME#v}"
              [ "$tag" = "$control" ] || {
                  echo "the tag says $tag and debian/control says $control"
                  echo "publishing two different things leaves the user unsure what they installed"
                  exit 1; }
          elif [ -n "$asked" ]; then
              # Typing a version by hand is how you publish the wrong thing:
              # refuse rather than silently build something else.
              [ "$asked" = "$control" ] || {
                  echo "you asked for $asked and debian/control says $control"
                  exit 1; }
          fi
          echo "VERSION=$control" >> "$GITHUB_ENV"
          echo "TAG=v$control" >> "$GITHUB_ENV"

      - name: This version was not published already
        run: |
          # Re-publishing over an existing release silently replaces a .deb that
          # people may already have installed, under the same version number.
          # Bump debian/control instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG already exists"
              echo "bump the version in debian/control and add a changelog entry"
              exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test suite
        run: bash tests/run.sh

      - name: Package
        run: python3 build.py --check

      - name: Lintian with no errors and no warnings
        run: |
          out="$(lintian --fail-on warning "tandem_${VERSION}_all.deb" 2>&1)" || {
              echo "$out"; exit 1; }
          [ -z "$out" ] || { echo "$out"; exit 1; }

      - name: Really install and purge before publishing
        run: |
          sudo apt-get install -y -qq "./tandem_${VERSION}_all.deb"
          tandem version
          tandem doctor > /tmp/diag.txt
          test -s /tmp/diag.txt
          sudo dpkg -P tandem

      - name: Checksum
        run: |
          sha256sum "tandem_${VERSION}_all.deb" > "tandem_${VERSION}_all.deb.sha256"
          cat "tandem_${VERSION}_all.deb.sha256"
          # The generic bundle rides along, for every Linux that is not Debian.
          # build.py --check (the Package step above) already wrote and validated
          # it; here it just gets its own checksum.
          sha256sum "tandem_${VERSION}_generic.tar.gz" \
              > "tandem_${VERSION}_generic.tar.gz.sha256"
          cat "tandem_${VERSION}_generic.tar.gz.sha256"

      - name: Release notes from the changelog
        run: |
          # The Debian changelog already is the release note; extracting this
          # version's entry avoids writing the same thing twice and drifting.
          awk -v v="$VERSION" '
              $0 ~ "^tandem \\(" v "\\)" { inside = 1; next }
              inside && /^tandem \(/ { exit }
              inside && /^ -- / { exit }
              inside { print }
          ' debian/changelog | sed 's/^  \* /- /; s/^    / /' > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "sudo apt install ./tandem_${VERSION}_all.deb"
            echo '```'
            echo
            echo "Then, to install whatever is missing (Wine, winetricks, Android):"
            echo
            echo '```bash'
            echo "tandem preparar"
            echo '```'
            echo
            echo "**Not on Debian or Ubuntu?** Fedora, Arch, openSUSE and the rest"
            echo "have no apt to take a .deb. Use the generic bundle instead:"
            echo
            echo '```bash'
            echo "tar xzf tandem_${VERSION}_generic.tar.gz && cd tandem-${VERSION}"
            echo "sudo ./install.sh          # sudo ./uninstall.sh removes it"
            echo '```'
            echo
            echo ".deb    SHA-256: \`$(cut -d' ' -f1 "tandem_${VERSION}_all.deb.sha256")\`"
            echo "generic SHA-256: \`$(cut -d' ' -f1 "tandem_${VERSION}_generic.tar.gz.sha256")\`"
          } >> notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, so the dispatch path works too: with no tag_name the
          # action infers it from the ref, which on a branch run is the branch.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Tandem ${{ env.VERSION }}"
          body_path: notes.md
          draft: false
          files: |
            tandem_${{ env.VERSION }}_all.deb
            tandem_${{ env.VERSION }}_all.deb.sha256
            tandem_${{ env.VERSION }}_generic.tar.gz
            tandem_${{ env.VERSION }}_generic.tar.gz.sha256
