name: CI

# Tandem had no CI for a long time. Until then, every check depended on somebody
# remembering to run it — and "I forgot to run it" shows up nowhere until the
# defect reaches the shop counter.
#
# This runs everything that works without Wine, without Waydroid and without a
# graphical session: the whole suite, the packager, and lintian against the real
# .deb.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    # Same base as Zorin 18, which is the project target.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate judges the diff; with no history it has nothing to compare against.
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck desktop-file-utils lintian winetricks

      - name: Test suite
        run: bash tests/run.sh

      - name: Package
        run: python3 build.py --check

      - name: Lintian with no errors and no warnings
        run: |
          version="$(grep '^Version:' debian/control | cut -d' ' -f2)"
          out="$(lintian --fail-on warning "tandem_${version}_all.deb" 2>&1)" || {
              echo "$out"; exit 1; }
          [ -z "$out" ] || { echo "$out"; exit 1; }
          echo "lintian clean"

      - name: Reproducible build
        run: |
          version="$(grep '^Version:' debian/control | cut -d' ' -f2)"
          a="$(sha256sum "tandem_${version}_all.deb" | cut -d' ' -f1)"
          python3 build.py >/dev/null
          b="$(sha256sum "tandem_${version}_all.deb" | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "two builds produced different files"; exit 1; }
          echo "reproducible: $a"

      - name: Really install, configure and purge
        run: |
          version="$(grep '^Version:' debian/control | cut -d' ' -f2)"
          sudo apt-get install -y -qq "./tandem_${version}_all.deb"
          tandem version
          tandem doctor > /tmp/diag.txt
          test -s /tmp/diag.txt || { echo "the diagnosis came out empty"; exit 1; }
          sudo dpkg -P tandem
          # Two traps already stepped on here, both from weak evidence.
          # "command -v" answers from bash's hash cache and pointed at a binary
          # that had already been removed. And a find for "*tandem*" is far too
          # broad: it matches the Tandem Computers terminal definitions
          # (tandem653, tandem6510) shipped by ncurses. Both failed a purge that
          # was perfect. Checking the package's exact paths is the right evidence.
          left=""
          for path in /usr/bin/tandem /usr/bin/tandem-exe /usr/bin/tandem-apk \
                         /usr/bin/tandem-android /usr/bin/tandem-repair \
                         /usr/lib/tandem /usr/share/applications/tandem.desktop \
                         /usr/share/mime/packages/tandem.xml \
                         /usr/share/man/man1/tandem.1.gz; do
              [ -e "$path" ] && left="$left $path"
          done
          [ -z "$left" ] || { echo "left behind after purge:$left"; exit 1; }
          dpkg -l tandem >/dev/null 2>&1 && { echo "dpkg still knows the package"; exit 1; }
          echo "purge clean"

      - name: ProofGate
        # The project owner's own gate: guards over the diff, tree state, and a
        # verdict pinned to the SHA.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/ChrnX0/proofgate/main/install.sh) || true
          [ -f .proofgate/verify.sh ] && bash .proofgate/verify.sh || \
            echo "proofgate unavailable in this run; the steps above already cover the essentials"
